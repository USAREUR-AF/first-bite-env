# Drop-in for first-bite's systemd unit (deployment/first-bite.service in
# USAREUR-AF/first-bite): /etc/systemd/system/first-bite.service.d/example-harbour.conf.
# Then: sudo systemctl daemon-reload && sudo systemctl restart first-bite
[Service]
# systemd copies the file to a directory only this service can read and sets
# CREDENTIALS_DIRECTORY; subscribers.yml reads it with
# aws_secret_access_key_file: "archive-secret-access-key". The file is
# 0600 root:root under /etc/first-bite/credentials/ (0700 root:root).
LoadCredential=archive-secret-access-key:/etc/first-bite/credentials/archive-secret-access-key
