<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 618" width="760" height="618" role="img" aria-labelledby="overlay-title overlay-desc" aria-label="A deployment is first-bite at a pinned commit, plus an overlay it owns">
<title id="overlay-title">A deployment is first-bite at a pinned commit, plus an overlay it owns</title>
<desc id="overlay-desc">first-bite (public) supplies the software: bite, the decoder, and mind, the capture and publish process. This repository, first-bite-env, is the overlay: first-bite.ref pins first-bite commit d65b038 (release v1.1.0); bite checks its dictionaries harbour-buoy and tide-gauge with make check; mind runs its site example-harbour, which sends Cursor-on-Target to a TAK server and records to an archive, over TLS 1.3. Every document, dictionary, address and name in it is invented. A private overlay is made from it as a template, with the same shape.</desc>
<style>text{font-family:"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif}.m{font-family:Menlo, Consolas, "Liberation Mono", "Courier New", monospace}.t{fill:#e6e9ee}.q{fill:#a3abb8}.a{fill:#8fb0ff}.g{fill:#6cc487}.w{fill:#e3b04f}.i{fill:#b3a6f5}.mu{fill:#9aa2ad}.on{fill:#0f1317}.bg{fill:#0f1317;stroke:#2c333d;stroke-width:1}.bx{fill:#0f1317;stroke:#7a8594;stroke-width:1.25}.bxp{fill:#171b21;stroke:#2c333d;stroke-width:1.25}.bxa{fill:#172544;stroke:#8fb0ff;stroke-width:1.25}.bxg{fill:#172b1e;stroke:#6cc487;stroke-width:1.25}.bxw{fill:#31281a;stroke:#e3b04f;stroke-width:1.25}.bxm{fill:#23262b;stroke:#9aa2ad;stroke-width:1.25;stroke-dasharray:2 4}.bxd{fill:#0f1317;stroke:#7a8594;stroke-width:1.25;stroke-dasharray:5 4}.ln{stroke:#7a8594;stroke-width:1.25;fill:none}.lnk{stroke:#e6e9ee;stroke-width:3;fill:none}.lna{stroke:#8fb0ff;stroke-width:2;fill:none}.lnd{stroke:#7a8594;stroke-width:1.25;fill:none;stroke-dasharray:6 5}.lnr{stroke:#2c333d;stroke-width:1;fill:none}.fa{fill:#8fb0ff}.fl{fill:#7a8594}.fk{fill:#e6e9ee}.fg{fill:#6cc487}.fp{fill:#171b21}.fr{fill:#2c333d}.f0{fill:#172544}.f1{fill:#31281a}.f2{fill:#221d3d}.f3{fill:#172b1e}.s0{stroke:#8fb0ff}.s1{stroke:#e3b04f}.s2{stroke:#b3a6f5}.s3{stroke:#6cc487}.c0{fill:#8fb0ff}.c1{fill:#e3b04f}.c2{fill:#b3a6f5}.c3{fill:#6cc487}.pp{fill:#0f1317}path,line{stroke-linejoin:round}</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="617" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="700" data-role="title" class="t">A deployment is first-bite at a pinned commit, plus an overlay it owns</text>
<text x="24" y="60" font-size="13" class="q">This repository is the overlay, with invented content. Yours is a private copy of it.</text>
<rect x="24" y="80" width="712" height="84" rx="10" class="bxp"/>
<text x="40" y="110" font-size="15" font-weight="700" class="t">USAREUR-AF/first-bite</text>
<text x="40" y="130" font-size="13" class="q">public: the software</text>
<text x="40" y="148" font-size="13" class="q">release v1.1.0</text>
<rect x="300" y="94" width="196" height="56" rx="8" class="bx"/>
<text x="398" y="117.5" font-size="15" font-weight="700" text-anchor="middle" class="t m">bite</text>
<text x="398" y="135.9" font-size="13" text-anchor="middle" class="q">the decoder</text>
<rect x="520" y="94" width="196" height="56" rx="8" class="bx"/>
<text x="618" y="117.5" font-size="15" font-weight="700" text-anchor="middle" class="t m">mind</text>
<text x="618" y="135.9" font-size="13" text-anchor="middle" class="q">capture and publish</text>
<path d="M150 228L150 173" class="lna"/><path d="M150 164L155 174L145 174z" class="fa"/>
<text x="162" y="190" font-size="13" font-weight="700" class="a">first-bite.ref pins</text>
