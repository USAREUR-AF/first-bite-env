<path d="M380 524L380 549" class="lnd"/><path d="M380 558L375 548L385 548z" class="fl"/>
<text x="392" y="546" font-size="13" font-weight="700" class="t">Use this template</text>
<rect x="24" y="558" width="712" height="48" rx="10" class="bxd"/>
<text x="40" y="587" font-size="13" data-role="note" class="t" xml:space="preserve"><tspan class="t" font-weight="700">Your private overlay: </tspan><tspan class="q">the same shape, your documents&#x27; dictionaries, your sites</tspan></text>
</svg>
