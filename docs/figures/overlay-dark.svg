<text x="500" y="316" font-size="13" font-weight="700" class="t m">deployments/</text>
<text x="500" y="338" font-size="14" font-weight="700" class="t m">example-harbour</text>
<text x="500" y="358" font-size="13" class="q">security: tls, TLS 1.3</text>
<path d="M500 380L505 380" class="ln"/><path d="M514 380L504 385L504 375z" class="fl"/>
<text x="522" y="384" font-size="13" font-weight="700" class="t">Cursor-on-Target</text>
