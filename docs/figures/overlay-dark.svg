<rect x="24" y="228" width="712" height="296" rx="12" class="bxa"/>
<text x="40" y="254" font-size="15" font-weight="700" class="a">first-bite-env: the overlay</text>
<text x="40" y="274" font-size="13" class="q">everything a deployment owns, none of the code</text>
