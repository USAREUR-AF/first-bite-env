name: lint

# actionlint over the workflows, yamllint over every YAML file, shellcheck
# over every shell script.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  # From actionlint_1.7.12_checksums.txt of that release.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  YAMLLINT_VERSION: 1.38.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and yamllint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint \
            --pattern "$archive" --dir "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          pipx install "yamllint==${YAMLLINT_VERSION}"

      - run: actionlint
      - run: yamllint --strict .
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
