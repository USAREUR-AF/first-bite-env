# Refuses material that does not belong in a public repository: credential
# shapes, capture files outside examples/, and names on the maintainers'
# needle list. The check is first-bite's tools/check-public-tree.sh at the
# commit in first-bite.ref; the list is the repository secret LEAK_NEEDLES. A
# hit prints the file, the line and an id of the needle, never the needle.
# Without the secret the name check is skipped and the log says so.
#
# pull_request_target runs with the secret, also for pull requests from forks.
# The job checks out the base branch only, so the check that runs is the one
# the merged first-bite.ref names. The pull request's commit is fetched into
# the object store and read from there with --tree: it is never checked out,
# built or run.
name: leak-gate

on:
  # The trigger is what gives a fork's pull request the needle list.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leak-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  leak-gate:
    name: leak-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No `ref:`. For pull_request_target the default is the head of the base
      # branch; for push it is the pushed commit.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the check at the commit first-bite.ref names
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < first-bite.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::first-bite.ref is not a full sha"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/check-public-tree.sh" \
            "https://raw.githubusercontent.com/USAREUR-AF/first-bite/${ref}/tools/check-public-tree.sh"

      - name: Fetch the pull request's commit as data
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The token is given to this one command and not stored in the clone.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet --depth=1 \
            origin "+refs/pull/${PR_NUMBER}/head:refs/leak-gate/head"
          fetched="$(git rev-parse refs/leak-gate/head)"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "refs/pull/${PR_NUMBER}/head is $fetched, this run is for $HEAD_SHA" >&2
            exit 1
          fi

      - name: Scan the pull request's commit
        if: github.event_name == 'pull_request_target'
        env:
          LEAK_NEEDLES: ${{ secrets.LEAK_NEEDLES }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "$RUNNER_TEMP/check-public-tree.sh" --tree "$HEAD_SHA"

      - name: Scan the pushed commit
        if: github.event_name == 'push'
        env:
          LEAK_NEEDLES: ${{ secrets.LEAK_NEEDLES }}
        run: bash "$RUNNER_TEMP/check-public-tree.sh"
